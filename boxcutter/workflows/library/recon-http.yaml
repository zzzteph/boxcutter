name: recon-http
help: recon, then httpx; show only the live HTTP(S) services
input: target
output: ${live}

steps:
  - workflow: recon
    target: ${target}
    save: hosts

  - for_each: ${hosts}
    do:
      - tool: httpx
        target: ${hosts.item}
        pick: url            # keep only the live URL string (like web-full / env-nuclei), so the
        save: live           # output is a clean one-per-line URL list (kind=urls), not httpx objects
