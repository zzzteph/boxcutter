name: web-scan
help: full DAST of one known URL (no httpx probe) - crawl -> fuzz + nuclei-dast + sqlmap per param URL -> swagger -> graphql-scan -> secrets per JS
input: url
output: findings

steps:
  # the given URL is the target as-is (no httpx liveness probe)
  - select: ${url}
    save: live

  - for_each: ${live}
    do:
      - workflow: web-crawl
        target: ${live.item}
        save: crawl

  # flatten the corpus to URL strings for the URL-based lanes, then extend with JS-extracted endpoints
  - select: ${crawl | urls}
    save: urls
  - for_each: ${urls | js}
    do:
      - tool: js-endpoints
        target: ${urls.item}
        pick: endpoints.url
        save: urls

  - select: ${urls | params | dedup}
    save: params

  # DAST each parameterised URL: fuzz + nuclei-dast + sqlmap. ZAP active scanning was removed - it produced
  # most of the noise/false positives on web targets. nuclei template passes run separately in web-full.
  - for_each: ${params}
    do:
      - tool: fuzz
        target: ${params.item}
        args: --timeout 120
        save: findings
      - tool: nuclei
        target: ${params.item}
        args: --opt-args=-dast
        save: findings
      - tool: sqlmap
        target: ${params.item}
        save: findings

  # POST/PUT lane: fuzz the captured body of each state-changing endpoint (empty on a non-SPA target)
  - for_each: ${crawl | writes}
    do:
      - tool: fuzz
        target: ${crawl.item.url}
        flags:
          --method: ${crawl.item.method}
          --data: ${crawl.item.body}
        args: --timeout 120
        save: findings

  # discover + DAST OpenAPI/Swagger endpoints - delegated to swagger-scan (find
  # specs on the host, then fuzz/nuclei-dast/sqlmap per endpoint)
  - workflow: swagger-scan
    target: ${url}
    save: findings

  # discover + audit GraphQL endpoint(s) - delegated to graphql-scan, which does
  # detect -> audit each (introspection, CSRF, batching, arg injection, mutation)
  - workflow: graphql-scan
    target: ${url}
    save: findings

  # secrets in each JS file
  - for_each: ${urls | js}
    do:
      - tool: scan-secrets
        target: ${urls.item}
        save: findings
